name: APK bauen

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: game,     dir: ".",      branch: apk-build,    cython: "0.29.36" }
          - { name: hello221, dir: hello221, branch: apk-hello221, cython: "0.29.36" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Abhaengigkeiten
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            libltdl-dev build-essential git
          pip install --upgrade pip
          pip install buildozer "cython==${{ matrix.cython }}" virtualenv setuptools
      - name: APK (debug) bauen
        shell: bash
        working-directory: ${{ matrix.dir }}
        run: buildozer -v android debug 2>&1 | tee build.log
      - name: APK in Branch ablegen
        shell: bash
        run: |
          mkdir -p /tmp/out && cp "${{ matrix.dir }}"/bin/*.apk /tmp/out/app.apk
          cd /tmp/out
          git init -q -b "${{ matrix.branch }}"
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add app.apk
          git commit -q -m "APK ${{ matrix.name }} aus Commit ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -f -q origin "${{ matrix.branch }}"
      - name: Fehlerzusammenfassung
        if: failure()
        shell: bash
        working-directory: ${{ matrix.dir }}
        run: |
          grep -n -E "ERROR|Error:|error:|FAILED|Traceback|Command failed|No matching|not found" build.log \
            | grep -v -E "won't be automatically|performance hint" | tail -25 | cut -c1-300
          tail -n 40 build.log | cut -c1-300
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-${{ matrix.name }}
          path: ${{ matrix.dir }}/build.log
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.name }}
          path: ${{ matrix.dir }}/bin/*.apk
